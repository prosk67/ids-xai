seed: 42
predictive_seeds: [42, 52, 62, 72, 82]
output_dir: outputs
data:
  cicids2017:
    shards:
      - data/raw/cic_train_0000.parquet
      - data/raw/cic_train_0001.parquet
    label_column: Label
    normal_label: BENIGN
    per_class_cap: 25000
    test_size: 0.20
  unsw_nb15:
    # The mirror filenames are reversed relative to the official row counts.
    train: data/raw/unsw_test.parquet
    test: data/raw/unsw_train.parquet
    label_column: label
    multiclass_column: attack_cat
    normal_label: Normal
models:
  random_forest:
    n_estimators: 120
    max_depth: 18
    min_samples_leaf: 2
  xgboost:
    n_estimators: 160
    max_depth: 7
    learning_rate: 0.08
    subsample: 0.85
    colsample_bytree: 0.85
tuning:
  validation_size: 0.15
  # Grids are deliberately small; the prespecified `models` settings are
  # always the first candidate and win ties.
  random_forest:
    max_depth: [18, null]
    min_samples_leaf: [1, 2]
    max_features: [sqrt, 0.5]
  xgboost:
    n_estimators: [160, 400]
    max_depth: [7, 10]
    learning_rate: [0.08, 0.15]
evaluation:
  explanation_samples: 200
  explanation_seeds: [42, 52, 62, 72, 82]
  faithfulness_subset_size: 5
  faithfulness_subsets: 50
  lime_samples: 350
  self_stability_samples: 6
  lime_repeat_seeds: 5
  fidelity_k: [1, 3, 5, 10]
  feature_ablation_k: [5, 10, 20]
  audit_samples: 100
  lime_budget_samples: 20
